[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The import package directory is `didis`, which differs from the distribution name `didis-py`,
# so it must be declared explicitly for hatchling to locate it.
packages = ["didis"]

[project]
name = "didis-py"
version = "0.1.0"
description = "Official Python SDK for the DID.is public API: DID resolution with evidence, credentials, policies and agent trust"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "DID.is" }
]
dependencies = [
    "httpx>=0.27.0",
]
keywords = ["did", "w3c", "decentralized-identifiers", "verifiable-credentials", "mcp", "a2a", "resolver"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://did.is"
Documentation = "https://did.is/developers"
Repository = "https://github.com/did-is/didis-py"
Issues = "https://github.com/did-is/didis-py/issues"
